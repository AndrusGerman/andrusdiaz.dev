apiVersion: apps/v1
kind: Deployment
metadata:
  name: slime
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: slime
  template:
    metadata:
      labels:
        app: slime
    spec:
      serviceAccountName: andrusdiaz-home
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: slime
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 150m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: slime
spec:
  selector:
    app: slime
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: slime
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-graceandfavorvzla-services
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - slime.andrusdiaz.dev
      secretName: slime-tls
  rules:
    - host: slime.andrusdiaz.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: slime
                port:
                  name: http
