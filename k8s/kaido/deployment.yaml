apiVersion: apps/v1
kind: Deployment
metadata:
  name: andrusdiaz-home
  labels:
    app.kubernetes.io/name: andrusdiaz-home
    app.kubernetes.io/part-of: andrusdiaz
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: andrusdiaz-home
  template:
    metadata:
      labels:
        app: andrusdiaz-home
        app.kubernetes.io/name: andrusdiaz-home
        app.kubernetes.io/part-of: andrusdiaz
    spec:
      serviceAccountName: andrusdiaz-home
      imagePullSecrets:
        - name: artifact-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: andrusdiaz-home
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
