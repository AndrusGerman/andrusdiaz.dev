apiVersion: v1
kind: ConfigMap
metadata:
  name: static-web-nginx
data:
  default.conf: |
    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        server_tokens off;
        gzip on;
        gzip_types text/css application/javascript application/json image/svg+xml;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bombona
  labels:
    app.kubernetes.io/name: bombona
    app.kubernetes.io/part-of: andrusdiaz
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: bombona
  template:
    metadata:
      labels:
        app: bombona
        app.kubernetes.io/name: bombona
        app.kubernetes.io/part-of: andrusdiaz
    spec:
      serviceAccountName: andrusdiaz-games
      imagePullSecrets:
        - name: artifact-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: bombona
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: nginx-config
          configMap:
            name: static-web-nginx
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: bombona
  labels:
    app.kubernetes.io/name: bombona
    app.kubernetes.io/part-of: andrusdiaz
spec:
  selector:
    app: bombona
  ports:
    - name: http
      port: 80
      targetPort: http
---
