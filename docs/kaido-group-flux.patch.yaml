# Apply these two resources in the central kaido-group repository under
# kubernetes/flux-system after resolving its local divergence.
# The web repository is public, so Flux does not need a source Secret.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: andrusdiaz-home
  namespace: flux-system
spec:
  interval: 5m
  suspend: false
  url: https://github.com/AndrusGerman/andrusdiaz.dev.git
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: andrusdiaz-home
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  path: ./k8s/kaido
  targetNamespace: andrusdiaz
  prune: false
  wait: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: andrusdiaz-home
